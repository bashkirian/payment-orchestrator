services:
  api:
    build:
      context: .
      dockerfile: ./services/api/Dockerfile
    container_name: fintech-api
    restart: unless-stopped
    environment:
      API_ENV: ${API_ENV}
      API_HTTP_ADDR: ${API_HTTP_ADDR}
      API_LOG_LEVEL: ${API_LOG_LEVEL}
      API_READ_TIMEOUT: ${API_READ_TIMEOUT}
      API_READ_HEADER_TIMEOUT: ${API_READ_HEADER_TIMEOUT}
      API_WRITE_TIMEOUT: ${API_WRITE_TIMEOUT}
      API_IDLE_TIMEOUT: ${API_IDLE_TIMEOUT}
      API_SHUTDOWN_TIMEOUT: ${API_SHUTDOWN_TIMEOUT}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fintech_local_net

  postgres:
    image: postgres:16.3-alpine
    container_name: fintech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      POSTGRES_APP_DB: ${POSTGRES_APP_DB}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - fintech_local_net

  redis:
    image: redis:7.2-alpine
    container_name: fintech-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - fintech_local_net

volumes:
  postgres_data:
    name: fintech_postgres_data
  redis_data:
    name: fintech_redis_data

networks:
  fintech_local_net:
    name: fintech_local_net
