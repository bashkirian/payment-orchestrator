services:
  api:
    build:
      context: .
      dockerfile: ./services/api/Dockerfile
    container_name: fintech-api
    restart: unless-stopped
    environment:
      API_ENV: ${API_ENV}
      API_HTTP_ADDR: ${API_HTTP_ADDR}
      API_LOG_LEVEL: ${API_LOG_LEVEL}
      API_READ_TIMEOUT: ${API_READ_TIMEOUT}
      API_READ_HEADER_TIMEOUT: ${API_READ_HEADER_TIMEOUT}
      API_WRITE_TIMEOUT: ${API_WRITE_TIMEOUT}
      API_IDLE_TIMEOUT: ${API_IDLE_TIMEOUT}
      API_SHUTDOWN_TIMEOUT: ${API_SHUTDOWN_TIMEOUT}
      API_REDIS_ADDR: redis:6379
      API_REDIS_PASSWORD: ${REDIS_PASSWORD}
      API_RATE_LIMIT_ENABLED: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fintech_local_net

  victoriametrics:
    image: victoriametrics/victoria-metrics:latest
    container_name: fintech-victoriametrics
    restart: unless-stopped
    ports:
      - "8428:8428"
    volumes:
      - victoriametrics_data:/victoria-metrics-data
    command:
      - '--storageDataPath=/victoria-metrics-data'
      - '--retentionPeriod=30d'
      - '--httpListenAddr=:8428'
    networks:
      - fintech_local_net

  victorialogs:
    image: victoriametrics/victoria-logs:latest
    container_name: fintech-victorialogs
    restart: unless-stopped
    ports:
      - "9428:9428"
    volumes:
      - victorialogs_data:/victoria-logs-data
    command:
      - '--storageDataPath=/victoria-logs-data'
      - '--retentionPeriod=30d'
      - '--httpListenAddr=:9428'
    networks:
      - fintech_local_net

  vmagent:
    image: victoriametrics/vmagent:latest
    container_name: fintech-vmagent
    restart: unless-stopped
    volumes:
      - ./deploy/vmagent/prometheus.yml:/etc/vmagent/prometheus.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - '--promscrape.config=/etc/vmagent/prometheus.yml'
      - '--remoteWrite.url=http://victoriametrics:8428/api/v1/write'
    depends_on:
      - victoriametrics
    networks:
      - fintech_local_net

  vector:
    image: timberio/vector:latest-alpine
    container_name: fintech-vector
    restart: unless-stopped
    volumes:
      - ./deploy/vector/vector.yaml:/etc/vector/vector.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - victorialogs
    networks:
      - fintech_local_net

  grafana:
    image: grafana/grafana:11.2.2
    container_name: fintech-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - victoriametrics
    networks:
      - fintech_local_net

  postgres:
    image: postgres:16.3-alpine
    container_name: fintech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_ADMIN_USER}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD}
      POSTGRES_DB: postgres
      POSTGRES_APP_DB: ${POSTGRES_APP_DB}
      POSTGRES_APP_USER: ${POSTGRES_APP_USER}
      POSTGRES_APP_PASSWORD: ${POSTGRES_APP_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - fintech_local_net

  redis:
    image: redis:7.2-alpine
    container_name: fintech-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks:
      - fintech_local_net

volumes:
  postgres_data:
    name: fintech_postgres_data
  redis_data:
    name: fintech_redis_data
  victoriametrics_data:
    name: fintech_victoriametrics_data
  victorialogs_data:
    name: fintech_victorialogs_data
  grafana_data:
    name: fintech_grafana_data

networks:
  fintech_local_net:
    name: fintech_local_net
