global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'api'
    static_configs:
      - targets: ['host.docker.internal:8080']
        labels:
          service: 'api'

  - job_name: 'orchestrator'
    static_configs:
      - targets: ['host.docker.internal:8081']
        labels:
          service: 'orchestrator'

  - job_name: 'webhook'
    static_configs:
      - targets: ['host.docker.internal:8082']
        labels:
          service: 'webhook'
