global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'api'
    static_configs:
      - targets: ['host.docker.internal:8080']

  - job_name: 'orchestrator'
    static_configs:
      - targets: ['host.docker.internal:8081']

  - job_name: 'webhook'
    static_configs:
      - targets: ['host.docker.internal:8082']
