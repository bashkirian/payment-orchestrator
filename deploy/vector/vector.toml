# Vector config to collect Docker logs and send to VictoriaLogs

[sources.docker_logs]
type = "docker_logs"
docker_host = "/var/run/docker.sock"

[transforms.add_labels]
type = "remap"
inputs = ["docker_logs"]
source = '''
.labels.service = .container_name
.labels.image = .image
'''

[sinks.victorialogs]
type = "loki"
inputs = ["add_labels"]
endpoint = "http://victorialogs:9428"
encoding.codec = "json"
labels.service = "{{ container_name }}"
