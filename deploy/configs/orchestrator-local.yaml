env: development
log_level: info
grpc_addr: ":50051"
http_addr: ":8081"
shutdown_timeout: 10s
database_url: "postgres://fintech_app:fintech_app_change_me@localhost:5432/fintech?sslmode=disable"
stripe:
  api_key: "sk_test_REPLACE_ME"
  max_retries: 2
  timeout_seconds: 30

# Multi-provider configuration per rail.
# Order defines priority: first = tried first, second = fallback, etc.
# Active: false = provider excluded from selection.
# Weight: 0-100 for volume split routing (default 50).
providers:
  card:
    - name: stripe
      active: true
      weight: 70
    - name: mock_card
      active: true
      weight: 30
  crypto:
    - name: crypto_sim
      active: true
      weight: 100

# Routing algorithm configuration.
routing:
  min_samples: 10  # minimum transactions before using success rate data

# Kafka retry queue configuration.
kafka:
  brokers:
    - localhost:9093
  topics:
    provider_retry: payout-retry-provider
    global_retry: payout-retry-global
    dlq: payout-retry-dlq
  consumer_group: orchestrator-retry-worker

# Retry configuration (Hyperswitch-inspired tiered delays with jitter).
retry:
  # Provider-level retry: quick retries for transient errors on same provider.
  provider:
    max_attempts: 3
    delays: [1s, 5s, 15s]  # tiered delays (jitter added at runtime)
  # Global retry: when all providers exhausted.
  global:
    max_attempts: 5
    delays: [30s, 2m, 5m, 15m, 30m]  # tiered delays (jitter added at runtime)
  # Jitter: random delay added to prevent thundering herd.
  jitter:
    min: 100ms
    max_percent: 20  # add up to 20% random jitter to each delay
