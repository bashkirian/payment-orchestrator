env: development
log_level: info
grpc_addr: ":50051"
http_addr: ":8081"
shutdown_timeout: 10s
database_url: "postgres://fintech_app:fintech_app_change_me@localhost:5432/fintech?sslmode=disable"
stripe:
  api_key: "sk_test_REPLACE_ME"
  max_retries: 2
  timeout_seconds: 30

# Multi-provider configuration per rail.
# Order defines priority: first = tried first, second = fallback, etc.
# Active: false = provider excluded from selection.
# Weight: 0-100 for volume split routing (default 50).
providers:
  card:
    - name: stripe
      active: true
      weight: 70
    - name: mock_card
      active: true
      weight: 30
  crypto:
    - name: crypto_sim
      active: true
      weight: 100

# Routing algorithm configuration.
routing:
  min_samples: 10  # minimum transactions before using success rate data
