version: "2"
sql:
  - engine: "postgresql"
    queries: "queries.sql"
    schema: "../../../../../db/migrations"
    gen:
      go:
        package: "sqlcgen"
        out: "../../../internal/persistence/sqlcgen"
        emit_interface: true
        emit_json_tags: true
        emit_pointers_for_null_types: true
        sql_package: "pgx/v5"
        overrides:
          - db_type: "uuid"
            go_type:
              import: "github.com/google/uuid"
              type: "UUID"
          - db_type: "timestamptz"
            go_type: "time.Time"
          - db_type: "timestamptz"
            nullable: true
            go_type: "*time.Time"
