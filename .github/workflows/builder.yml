name: Build and Push Builder Image

on:
  push:
    branches:
      - main
      - master
    paths:
      - Dockerfile
      - .protoc-version   # also rebuild when protoc version changes
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    name: Build Builder Image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fintech-builder:latest
            ghcr.io/${{ github.repository_owner }}/fintech-builder:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
