name: PR Checks

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  build-and-lint:
    name: Build and Lint
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/fintech-builder:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build
        run: make build

      - name: Lint
        run: make lint
