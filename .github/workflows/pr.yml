name: PR Checks

on:
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read
  packages: read

jobs:
  proto-gen-check:
    name: Proto Generated Code Check
    runs-on: ubuntu-latest
    # Intentionally NOT using the builder container — protoc is installed
    # directly from .protoc-version so this check is never stale due to image caching.

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read protoc version
        id: protoc_version
        run: echo "version=$(cat .protoc-version)" >> "$GITHUB_OUTPUT"

      - name: Install protoc
        run: |
          PROTOC_VERSION="${{ steps.protoc_version.outputs.version }}"
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64)  PROTOC_ARCH="linux-x86_64" ;;
            aarch64) PROTOC_ARCH="linux-aarch_64" ;;
            *) echo "Unsupported arch: $ARCH" && exit 1 ;;
          esac
          curl -sSL "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-${PROTOC_ARCH}.zip" \
            -o /tmp/protoc.zip
          sudo unzip -q /tmp/protoc.zip -d /usr/local
          rm /tmp/protoc.zip
          protoc --version

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install protoc Go plugins
        run: |
          go install google.golang.org/protobuf/cmd/protoc-gen-go@latest
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Regenerate proto and check for diff
        run: |
          make proto-gen
          git diff --exit-code libs/genproto/

  build-and-lint:
    name: Build and Lint
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/fintech-builder:latest
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Mark workspace as safe for git (container)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Add Go bin to PATH for protoc plugins
        run: echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Build
        run: make build

      - name: Lint
        run: make lint

  integration-deps-and-migrations:
    name: Dependencies, Migrations and Docker Build
    runs-on: ubuntu-latest
    needs: build-and-lint
    env:
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: 5432
      POSTGRES_ADMIN_USER: fintech_admin
      POSTGRES_ADMIN_PASSWORD: fintech_admin_change_me
      POSTGRES_APP_DB: fintech
      POSTGRES_APP_USER: fintech_app
      POSTGRES_APP_PASSWORD: fintech_app_change_me
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis_change_me

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Mark workspace as safe for git (container)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Start Postgres and Redis
        run: make reset || true && make up

      - name: Install Goose CLI
        run: |
          go install github.com/pressly/goose/v3/cmd/goose@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Run migrations
        run: |
          goose -dir db/migrations postgres "postgres://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_APP_DB}?sslmode=disable" up

      - name: Show migration status
        run: |
          goose -dir db/migrations postgres "postgres://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_APP_DB}?sslmode=disable" status

      - name: Build Docker image
        run: docker build -t fintech-app:pr .

      - name: Future app container hook
        run: echo "App container run is intentionally deferred; add service startup validation here when the runtime contract is defined."

      - name: Stop local dependencies
        if: always()
        run: make down
