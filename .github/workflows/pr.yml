name: PR Checks

on:
  pull_request:
    branches:
      - main
      - master

permissions:
  contents: read
  packages: read

jobs:
  build-and-lint:
    name: Build and Lint
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/${{ github.repository_owner }}/fintech-builder:latest
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Mark workspace as safe for git (container)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Add Go bin to PATH for protoc plugins
        run: echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Check proto generated code is up to date
        run: |
          make proto-gen
          git diff --exit-code libs/genproto/

      - name: Build
        run: make build

      - name: Lint
        run: make lint

  integration-deps-and-migrations:
    name: Dependencies, Migrations and Docker Build
    runs-on: ubuntu-latest
    needs: build-and-lint
    container:
      image: ghcr.io/${{ github.repository_owner }}/fintech-builder:latest
      credentials:
        username: ${{ github.repository_owner }}
        password: ${{ secrets.GITHUB_TOKEN }}
      volumes:
        - /var/run/docker.sock:/var/run/docker.sock
    env:
      POSTGRES_HOST: fintech-postgres
      POSTGRES_PORT: 5432
      POSTGRES_ADMIN_USER: fintech_admin
      POSTGRES_ADMIN_PASSWORD: fintech_admin_change_me
      POSTGRES_APP_DB: fintech
      POSTGRES_APP_USER: fintech_app
      POSTGRES_APP_PASSWORD: fintech_app_change_me
      REDIS_PORT: 6379
      REDIS_PASSWORD: redis_change_me

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Mark workspace as safe for git (container)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Start Postgres and Redis
        run: make up

      - name: Connect job container to fintech network
        run: docker network connect fintech_local_net $(hostname)

      - name: Run migrations
        run: |
          goose -dir db/migrations postgres "postgres://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_APP_DB}?sslmode=disable" up

      - name: Show migration status
        run: |
          goose -dir db/migrations postgres "postgres://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_APP_DB}?sslmode=disable" status

      - name: Build Docker image
        run: docker build -t fintech-app:pr .

      - name: Future app container hook
        run: echo "App container run is intentionally deferred; add service startup validation here when the runtime contract is defined."

      - name: Stop local dependencies
        if: always()
        run: make down
